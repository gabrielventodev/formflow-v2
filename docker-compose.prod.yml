# Producción en un solo servidor (VM de Google Cloud, VPS, etc.).
# Solo Caddy queda expuesto a internet (80 y 443, con https automático); el resto
# de los servicios hablan por la red interna de Docker.
#
#   cp deploy/.env.prod.example .env    # y completa los valores
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Este archivo levanta producción y el Caddy que atiende a todos los ambientes.
# QA usa docker-compose.ambiente.yml, que reutiliza estos mismos servicios
# (con su propia base, sus archivos y sus secretos) sin un segundo Caddy.
#
# Guías paso a paso: docs/despliegue-gcp.md y docs/ambientes.md

name: formsis

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env}
      # Dominios viejos de producción (separados por espacios) que redirigen a DOMINIO.
      DOMINIO_ANTERIOR: ${DOMINIO_ANTERIOR:-}
      # Dominio del sitio de presentación (repo formsis-web); www redirige a él.
      DOMINIO_WEB: ${DOMINIO_WEB:-formsis.com}
      # Ambiente de QA, solo accesible desde IPS_PERMITIDAS (ver docs/ambientes.md).
      DOMINIO_QA: ${DOMINIO_QA:-qa.formsis.com}
      # IPs o rangos (separados por espacios) que pueden entrar a QA. Sin definir, nadie entra.
      IPS_PERMITIDAS: ${IPS_PERMITIDAS:-127.0.0.1/32}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sitio de presentación: repo aparte (gabrielventodev/formsis-web) clonado al lado de este.
      - ../formsis-web:/srv/sitio:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - borde
    depends_on:
      - web
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formsis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: formsis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formsis"]
      interval: 5s
      retries: 10
    logging: *logging

  storage:
    # Fork compatible de MinIO (las imágenes oficiales ya no se publican).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD en .env}
    volumes:
      - storage:/data
    # La consola queda solo en el propio servidor; ábrela con un túnel SSH (ver la guía).
    # QA usa otro puerto (9002) para no chocar.
    ports:
      - "127.0.0.1:${PUERTO_CONSOLA_MINIO:-9001}:9001"
    logging: *logging

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://formsis:${POSTGRES_PASSWORD}@db:5432/formsis?sslmode=disable
      WEB_ORIGIN: https://${DOMINIO}
      WEB_PUBLIC_URL: https://${DOMINIO}
      COOKIE_SECURE: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: storage:9000
      S3_BUCKET: formsis
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:?Falta SMTP_HOST en .env (sin SMTP los enlaces de acceso quedarían en el log)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Formsis <no-reply@localhost>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      ORG_NAME: ${ORG_NAME:-Mi organización}
      FACE_URL: http://face:8000
      FACE_TOKEN: ${FACE_TOKEN:?Falta FACE_TOKEN en .env}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
      face:
        condition: service_started
    logging: *logging

  face:
    build: ./face
    restart: unless-stopped
    environment:
      FACE_TOKEN: ${FACE_TOKEN}
    logging: *logging

  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      HOSTNAME: 0.0.0.0
    # La red "borde" la comparten los dos ambientes con Caddy, que llega a cada web por su
    # alias (web-prod, web-qa). El resto de los servicios queda en la red propia del ambiente.
    networks:
      default:
      borde:
        aliases:
          - web-${AMBIENTE:-prod}
    depends_on:
      - api
    logging: *logging

networks:
  # La crea producción; QA se suma a ella (en docker-compose.ambiente.yml es "external").
  borde:
    name: formsis-borde

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
