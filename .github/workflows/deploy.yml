# Deploy automático: cada push a main (por ejemplo al hacer merge de un PR) entra por SSH
# al servidor y corre deploy/actualizar.sh. También se puede lanzar a mano desde la pestaña Actions.
# Configuración (secretos del repositorio): ver "Deploy automático" en docs/despliegue-gcp.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez; si llegan dos merges seguidos, el segundo espera al primero.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Actualizar el servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            # Sin configurar no es un error: el deploy queda apagado hasta crear los secretos.
            echo "::notice::Deploy automático sin configurar: faltan los secretos DEPLOY_*. Ver \"Deploy automático\" en docs/despliegue-gcp.md."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          # En el servidor la llave solo puede correr deploy/actualizar.sh (ver la guía),
          # así que el comando que se mande aquí da igual.
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" actualizar
