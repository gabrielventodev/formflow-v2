# Ambientes de prueba (QA y dev) en el mismo servidor que producción.
# Reutiliza los servicios de docker-compose.prod.yml, cada ambiente con su propia base,
# sus archivos y sus secretos (en el .env de su carpeta), pero sin Caddy: lo atiende el
# Caddy de producción, que llega a la web de este ambiente por la red compartida "formsis-borde".
#
# Cada ambiente vive en su propia carpeta clonada de su rama (ver docs/ambientes.md):
#   ~/formsis-v2-qa   (rama qa,  .env con AMBIENTE=qa)
#   ~/formsis-v2-dev  (rama dev, .env con AMBIENTE=dev)
# y se actualiza con deploy/actualizar.sh, que usa el proyecto "formsis-qa" o "formsis-dev".

name: formsis-${AMBIENTE:?Falta AMBIENTE en .env (qa o dev)}

services:
  db:
    extends:
      file: docker-compose.prod.yml
      service: db

  storage:
    extends:
      file: docker-compose.prod.yml
      service: storage

  face:
    extends:
      file: docker-compose.prod.yml
      service: face

  api:
    extends:
      file: docker-compose.prod.yml
      service: api

  web:
    extends:
      file: docker-compose.prod.yml
      service: web

networks:
  # La crea producción (docker-compose.prod.yml); este ambiente solo se suma.
  borde:
    name: formsis-borde
    external: true

volumes:
  pgdata:
  storage:
