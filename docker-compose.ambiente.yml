# Ambiente de QA en el mismo servidor que producción.
# Reutiliza los servicios de docker-compose.prod.yml, con su propia base,
# sus archivos y sus secretos (en el .env de su carpeta), pero sin Caddy: lo atiende el
# Caddy de producción, que llega a la web de QA por la red compartida "formsis-borde".
#
# Vive en su propia carpeta clonada de la rama qa (ver docs/ambientes.md):
#   ~/formsis-v2-qa   (.env con AMBIENTE=qa)
# y se actualiza con deploy/actualizar.sh, que usa el proyecto "formsis-qa".

name: formsis-${AMBIENTE:?Falta AMBIENTE en .env (qa)}

services:
  db:
    extends:
      file: docker-compose.prod.yml
      service: db

  storage:
    extends:
      file: docker-compose.prod.yml
      service: storage

  face:
    extends:
      file: docker-compose.prod.yml
      service: face

  api:
    extends:
      file: docker-compose.prod.yml
      service: api

  web:
    extends:
      file: docker-compose.prod.yml
      service: web

networks:
  # La crea producción (docker-compose.prod.yml); este ambiente solo se suma.
  borde:
    name: formsis-borde
    external: true

volumes:
  pgdata:
  storage:
