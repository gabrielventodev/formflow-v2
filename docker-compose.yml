services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: formflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formflow}
      POSTGRES_DB: formflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formflow"]
      interval: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-formflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-formflow-secret}
    volumes:
      - storage:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://formflow:${POSTGRES_PASSWORD:-formflow}@db:5432/formflow?sslmode=disable
      WEB_ORIGIN: http://localhost:3000
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: storage:9000
      S3_BUCKET: formflow
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-formflow}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-formflow-secret}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-FormFlow <no-reply@localhost>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@formflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiame123}
      FACE_URL: http://face:8000
      FACE_TOKEN: ${FACE_TOKEN:-cambia-este-token}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
      face:
        condition: service_started
    ports:
      - "8080:8080"

  # Prueba de vida (submódulo face/). Solo lo llama la API por la red interna; no publica puertos.
  face:
    build: ./face
    environment:
      FACE_TOKEN: ${FACE_TOKEN:-cambia-este-token}

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage:
